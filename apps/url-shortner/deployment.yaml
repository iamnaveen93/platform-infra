apiVersion: apps/v1
kind: Deployment

metadata:
  name: url-shortner
  namespace: url-shortner

spec:
  replicas: 1

  selector:
    matchLabels:
      app: url-shortner

  template:
    metadata:
      labels:
        app: url-shortner

    spec:
      containers:
        - name: url-shortner
          image: url-shortner:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: url-shortner-config
            - secretRef:
                name: url-shortner-secret

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
